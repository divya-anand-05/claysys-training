<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>
    <style>
        /* For result Page */

        body {
    background: linear-gradient(135deg, #f5f7fa,#c3cfe2);
    font-family: Arial;
    color: white;
    min-height: 100vh;
}
.container{
    max-width: 500px;
    margin: 60px auto;
    /* background: rgba(0,0,0,0.7); */
    background: rgba(255,255,255,0.9);
    padding: 40px;
    color:#333;
    border-radius: 14px;
    text-align: center;
    animation: popIn 0.6s ease;
}


.progress-wrapper {
    position: relative;
    width: 160px;
    height: 160px;
    margin: 30px auto;
}

.progress-ring {
    transform: rotate(-90deg);
}

.progress-ring-bg {
    fill: none;
    stroke: #e5e7eb;
    stroke-width: 12;
}

.progress-ring-fill {
    fill: none;
    stroke: #209ae0;
    stroke-width: 12;
    stroke-linecap: round;
    stroke-dasharray: 440;
    stroke-dashoffset: 440;
    transition: stroke-dashoffset 1s ease;
}

.progress-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: bold;
}

/* DARK MODE */
body.dark .progress-ring-bg {
    stroke: #2f3b45;
}

body.dark .progress-ring-fill {
    stroke: #4fc3f7;
}


.result-buttons{
    display: flex;
    gap:15px;
    margin-top: 30px;
}

.result-buttons button{
    flex:1;
    padding: 12px;
    font-size: 16px;
    background: #209ae0;
    color:white;
    border:none;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.result-buttons button:hover{
    background: #167bb5;
}

@keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(32,154,224,0.7); }
    70% { box-shadow: 0 0 0 15px rgba(32,154,224,0); }
    100% { box-shadow: 0 0 0 0 rgba(32,154,224,0); }
}

/* Dark theme */
body.dark {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #e5e7eb;
}

/* Container */
body.dark .container {
    background: rgba(0, 0, 0, 0.75);
    color: #e5e7eb;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
}

/* Score Circle */
body.dark .score-circle {
    border-color: #4fc3f7;
    color: #4fc3f7;
}

/* Buttons */
body.dark .result-buttons button {
    background: linear-gradient(135deg, #36d1dc, #5b86e5);
    color: #fff;
}

body.dark .result-buttons button:hover {
    background: linear-gradient(135deg, #5b86e5, #36d1dc);
}

/* Pulse animation glow (dark) */
body.dark .score-circle {
    animation: pulseDark 1.5s infinite;
}

@keyframes pulseDark {
    0% { box-shadow: 0 0 0 0 rgba(79,195,247,0.6); }
    70% { box-shadow: 0 0 0 18px rgba(79,195,247,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,195,247,0); }
}
    </style>
</head>
<body>
    <div class="container">
        <h1> Quiz Result</h1>
        <p id="summary" aria-live="polite"></p>
      <div class="progress-wrapper">
    <svg class="progress-ring" width="160" height="160" role="progressbar"
      aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
                 aria-label="Quiz Score Percentage">
        <circle
            class="progress-ring-bg"
            cx="80"
            cy="80"
            r="70"
        />
        <circle
            class="progress-ring-fill"
            cx="80"
            cy="80"
            r="70"
        />
    </svg>
    <div class="progress-text" id="scorePercent" aria-live="polite"></div>
</div>

        <div class ="result-buttons">
            <button id="retryBtn" aria-label="Retake Quiz">Retake Quiz</button>
            <button id="homeBtn" aria-label="Choose Another Course">Choose Another Course</button>
            <button aria-label="View Leaderboard" onclick="window.location.href='leaderboard.html'">
    View Leaderboard
</button>

        </div>
        
    </div>
    <script src="js/result.js" defer></script>
    <script src="js/theme.js" defer></script>
</body>
</html>
