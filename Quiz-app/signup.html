<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp Page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #333;
        }

        /* Login Container */
        .container {
            width: 350px;
            padding: 30px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.6s ease;
            text-align: center;
        }

        /* Heading */
        .container h1 {
            margin-bottom: 25px;
            color: #209ae0;
        }

        /* Inputs */
        .container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            transition: border 0.3s, box-shadow 0.3s;
        }

        .container input:focus {
            outline: none;
            border-color: #209ae0;
            box-shadow: 0 0 0 2px rgba(32, 154, 224, 0.2);
        }

        /* Login Button */
        .container button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #209ae0, #6dd5fa);
            color: white;
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .container button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(32, 154, 224, 0.35);
        }

        /* Fade-in animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile Responsive */
        @media (max-width: 400px) {
            .container {
                width: 90%;
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container" role="form">
        <h1>SignUp Page</h1>
        <input id="name" placeholder="Name" aria-required="true">
        <input id="email" placeholder="Email" aria-required="true">
        <input id="password" type="password" placeholder="Password" aria-required="true">
        <button id="signupBtn" onclick="signup()" aria-label="Sign Up">Signup</button>

    </div>
    <script src="signup.js" defer></script>
</body>

</html>
