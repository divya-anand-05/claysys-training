<!DOCTYPE html>
<html>
<head>
    <title>Manage Leaderboard</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-container">
        <h1>Manage Leaderboard</h1>

        <!-- Course/Quiz Selection -->
        <h2>Select Course/Quiz</h2>
        <select id="courseSelect" onchange="loadLeaderboard()">
            <option value="">--Select Course--</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="JavaScript">JavaScript</option>
            <option value="React">React</option>
            <option value="Angular">Angular</option>
            <option value="Vue.js">Vue.js</option>
            <option value="C#">C#</option>
            <option value="Python">Python</option>
            <option value="Java">Java</option>
            <option value="SQL">SQL</option>
            <option value="MySQL">MySQL</option>
            <option value="MongoDB">MongoDB</option>
        </select>

        <!-- Leaderboard Table -->
         <div class="table-container">
        <table id="leaderboardTable" style="display:none;" role="table" aria-label="Leaderboard Table">
            <thead>
                <tr>
                    <th scope="col">Rank</th>
                    <th scope="col">User Name</th>
                    <th scope="col">Score</th>
                    <th scope="col">Date</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody aria-live="polite"></tbody>
        </table>
        </div>

        <button onclick="goBack()" aria-label="Back to Dashboard">Back to Dashboard</button>
    </div>

    <script src="leaderboard.js" defer></script>
    <script src="../User/js/theme.js" defer></script>
</body>
</html>
