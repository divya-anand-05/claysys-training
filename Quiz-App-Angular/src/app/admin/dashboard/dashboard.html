<div class="admin-container">

  <!-- Top Bar -->
  <div class="topbar">
    <div class="logo">
      <i class="fas fa-user"></i>
    </div>
    <div class="topbar-title">
      <h2>Admin Dashboard</h2>
      <p>Welcome, {{ adminName }}</p>
    </div>
    <div class="topbar-right">
      <button class="theme-toggle" (click)="toggleTheme()" title="Toggle dark mode">
        <i [class]="isDark ? 'fas fa-sun' : 'fas fa-moon'"></i>
      </button>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="dashboard-content">

    <!-- Stats Section -->
    <h3>Statistics Overview</h3>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">
          <i class="fas fa-question-circle"></i>
        </div>
        <div class="stat-info">
          <h4>Total Questions</h4>
          <p class="stat-value">{{ totalQuestions }}</p>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">
          <i class="fas fa-users"></i>
        </div>
        <div class="stat-info">
          <h4>Total Users</h4>
          <p class="stat-value">{{ totalUsers }}</p>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">
          <i class="fas fa-trophy"></i>
        </div>
        <div class="stat-info">
          <h4>Leaderboard Entries</h4>
          <p class="stat-value">{{ totalScores }}</p>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <h3>Quick Actions</h3>
    <div class="actions-grid">
      <button class="action-btn manage-btn" (click)="goToQuestions()">
        <i class="fas fa-edit"></i>
        <span>Manage Questions</span>
      </button>
      <button class="action-btn view-btn" (click)="goToLeaderboard()">
        <i class="fas fa-chart-bar"></i>
        <span>View Leaderboard</span>
      </button>
    </div>

  </div>

</div>
