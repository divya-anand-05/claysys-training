<div class="login-container">
  <h1>Login</h1>

  <input
    type="email"
    placeholder="Email"
    [(ngModel)]="email"
  />

  <input
    type="password"
    placeholder="Password"
    [(ngModel)]="password"
  />

  <button (click)="login()">Login</button>

  <p *ngIf="errorMessage" style="color:red; margin-top:10px;">
    {{ errorMessage }}
  </p>

  <p style="margin-top:15px;">
    Don’t have account?
    <a routerLink="/signup">Signup</a>
  </p>
</div>
